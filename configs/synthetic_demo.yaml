# Synthetic smoke-test demo. Outputs are "synthetic smoke-test output, not a paper result".
run:
  name: synthetic_demo
  seed: 0
  output_dir: outputs/synthetic_demo
  data_kind: synthetic
data:
  source: synthetic
  synthetic:
    n_sessions: 240          # per value of n_sites
    n_sites: [4, 6]          # several N so that E1/E5 have more than one N
    n_questions: 60
    seed: 0
split:
  fractions: [0.4, 0.3, 0.3]   # attacker-train, selection, final-test (question-disjoint)
  seed: 0
attack:
  n_estimators: 50
  n_boot: 100
  models: [rf]               # the CNN attacker needs PyTorch (not installed here)
energy:
  cost_models: {}            # empty -> placeholder coefficients (allowed for synthetic data only)
  measured_energy_csv: null
grid:                        # reduced grid for a fast demo; Sec. 6.3 grid is in experiment_template.yaml
  padding: {ratio: [2.0], base: [512]}
  rounds: {window: [0.5], cover_prob: [0.5, 1.0], reply_frame: [16384]}
  dp: {mode: [queue, arrivals], interval: [1.0], eps_dir: [4.0], delta_percentile: [100.0], horizon: [30.0]}
budgets:
  site_J: []                 # empty -> quantiles of modelled cost (pipeline test only)
  orchestrator_J: null
baselines:
  fixed_padding_percentile: 99.0
  netshaper_root: null       # NetShaper needs captures of a real NetShaper run (TODO N-1)
experiments:
  e4: {repeat_e3: true}
  e5:
    alpha: 0.6
    query_mixes: [[aggregate, group_by, train_round, record_count], [aggregate, record_count]]
